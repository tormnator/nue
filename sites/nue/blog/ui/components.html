<!--
  Author component. Image, name, and X username. Used in blog post header.
 -->
<author data-component="author">
  <span><img src="{ img }" width="36" height="36"></span>

  <aside>
    <h3>{ name }</h3>
    <a href="//x.com/{ username }">@{ username }</a>
  </aside>
</author>

<time :is="pretty-date">
  { pretty }

  <script>
    const DATE_FORMAT = new Intl.DateTimeFormat('en-US', {
      month: 'short', day: 'numeric', year: 'numeric'
    })
    let date = this.date || new Date()
    if (typeof date == 'string') date = new Date(date)
    this.pretty = DATE_FORMAT.format(date)
  </script>
</time>

<ul :is="blog-entries" data-component="blog-entries">
  <li :each="el in blog">
    <a href="{ el.url }">
      <pretty-date :date="el.date"/>
      <strong>{{ markdown(el.title) }}</strong>
    </a>
  </li>
</ul>
