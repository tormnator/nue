
# Nue settings
site:
  origin: https://nuejs.org
  view_transitions: true

content:
  sections: true

collections:
  blog:
    include: [ blog ]
    skip: [ noindex, draft ]
    sort: date desc

design:
  layers: [ design, layout, component ]
  inline_css: true

sitemap:
  enabled: true

# Note: `title` and `description` below are content and should be moved to `@shared/data/content.yaml`, but due to the current Nue implementation they have to stay here in `site.yaml`.
rss:
  title: Nue developer blog
  description: The UNIX of the Web
  collection: blog
  enabled: true
