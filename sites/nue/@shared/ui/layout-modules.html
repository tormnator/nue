<!html lib>

<head>
  <!-- The color-scheme meta element tells the browser how it supports light and dark color schemes
    (by "support" is meant which schemes it allows the browser to use). The browser uses this
    information to adjust its UI accordingly (and before the page's CSS is applied on initial load),
    avoiding a flash of incorrect colors. Keep this setting in sync with the color-scheme CSS property. -->
  <meta name="color-scheme" content="light dark">
</head>

<header>
  <nav>
    <a href="/"><b class="wordmark">NUE</b></a>
    <a href="/docs/">Docs</a>
    <a href="/blog/">Blog</a>

    <a :if="teaser" data-component="teaser" href="{ teaser.url }">
      <span data-component="badge">{ teaser.tag}</span>
      { teaser.text }
    </a>
  </nav>

  <nav>
    <div data-component="theme-selector">
      <button type="button" popovertarget="theme-menu" aria-label="{ themeButton.ariaLabel }">{ themeButton.label }</button>
      <div id="theme-menu" popover>
        <menu>
          <li><button type="button" data-value="auto">{ themeMenu.system }</button></li>
          <li><button type="button" data-value="light">{ themeMenu.light }</button></li>
          <li><button type="button" data-value="dark">{ themeMenu.dark }</button></li>
        </menu>
      </div>
    </div>

    <a href="{ slack.url }" data-kind="social-media-link">
      <slack-icon width="18" height="18"/>
      <strong>Slack</strong>
    </a>

    <a href="{ gh.url }" data-look="pill">
      <github-icon width="18" height="18"/> { gh.count }
    </a>
  </nav>
</header>

<aside :is="beside">
  <!--
   The join mailing list feature is disabled until the server-side implementation is reimplemented.
   See `components-client-side.html and the `join` section in the `@shared/data/content.yaml` for
   more details. 2026-06-24, @tormnator.
   NOTE: Temporarily enabled again for the purpose of testing styling/design work. 2026-07-9, @tormnator.
   -->
  <!-- join mailing list -->
<!---->
  <h2>{ join.title }</h2>
  <p>{{ markdown(join.desc) }}</p>
  <join-list :bind="join.form"/>
  <!---->
</aside>

<footer>
  <hr>
  <b class="wordmark">NUE</b>
  <span>— { tagline }</span>
</footer>
