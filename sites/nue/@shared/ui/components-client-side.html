<!dhtml lib>

<!--
 The join mailing list feature is disabled until the server-side implementation is reimplemented.
 See `layout-modules.html` and the `join` section in the `site.yaml` for more details. The code is
 still active here, but <join-list> should not be used anywhere for now. 2026-06-24, @tormnator.
-->

<join-list data-component="join-list">

  <p :if="sessionStorage.joined">{ done }</p>

  <form :else :onsubmit="submit">
    <div data-kind="edit-boxes">
      <input type="email" placeholder="Your email" name="email" autocomplete="email" required>
      <textarea placeholder="{ comment }" name="comment"></textarea>
    </div>
    <div>
      <button type="submit" data-variant="brand">{ cta }</button>
    </div>
  </form>

  <script>
    submit(e) {
      const data = Object.fromEntries(new FormData(e.target).entries())

      fetch('/public/members', {
        'Content-Type': 'application/json',
        body: JSON.stringify(data),
        method: 'POST',
      })

      sessionStorage.joined = true
    }
  </script>
</join-list>
