# Tooling: A list of Nue packages ("tooling" might be a slightly misleading term). Used by the nue-stack HTML Component (sites/nue/@shared/lib/stack/stack.html). This component is used both on the home page and in the "Nue 2.0: The UNIX of the web" article.
tooling:
  - title: Nuekit
    desc: Standards first web framework
    info: Full-stack web framework based on modern HTML, CSS, and JavaScript

  - title: Nuedom
    desc: HTML first UI assembly
    info: Build reactive components with semantic HTML instead of virtual DOM abstractions

  - title: Nuestate
    desc: URL first state management
    info: Incredibly simple state management based on native pushState and modern web storage

  - title: Nuemark
    desc: Content first web development
    info: Build rich, interactive sites focusing purely on content

  - title: Nueserver
    desc: Edge-first server development
    info: Write server code that works identically locally and on CloudFlare Workers

  - title: Nueglow
    desc: CSS first syntax highlighting
    info: Semantic, design system compatible syntax blocks. Style with CSS, not class names


# Features: A list of key features for the framework, categorized by their functionality. Used by the nue-stack HTML Component (sites/nue/@shared/lib/stack/stack.html). This component is used both on the home page and in the "Nue 2.0: The UNIX of the web" article.
features:
  Dev server:
    - Direct serving
    - Universal HMR
    - SPA development
    - SVG development
    - Minimal config
    - 10ms startup

  Static site generator:
    - Extended Markdown
    - Layout module system
    - Dynamic islands
    - View transitions
    - Content collections
    - RSS feeds & sitemaps

  Application builder:
    - TypeScript transpiling
    - JS/CSS optimization
    - CSS inlining
    - API routing
    - Full-stack previews
    - CloudFlare compatibiliity

