<!-- Stack HTML Component: Displays tooling and features in a card layout. Is used both on the home
     page and in the "Nue 2.0: The UNIX of the web" article. -->
<nue-stack data-component="nue-stack">

  <section data-name="tools">
    <div :each="tool, i in tooling" title="{ tool.info }">
      <h3 data-kind="title"><box-icon class="branded"/> { tool.title }</h3>
      <p>{ tool.desc }</p>
    </div>
  </section>

  <aside data-name="features">
    <div :each="[ title, feats ] in Object.entries(features)">
      <h3>{ title }</h3>
      <p :each="feat in feats">{ feat }</p>
    </div>
  </aside>

</nue-stack>
