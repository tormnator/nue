<!dhtml lib>

<script>
  import { createConsole } from './console.js'
</script>

<!-- Console Component: Simulates the Nue install, create, development, and building process.
     Is used both on the home page and in the "Nue 2.0: The UNIX of the web" article. -->
<console data-component="console">
  <header>
    <a :onclick="model.prev()">←</a>
    <a :onclick="model.next()">→</a>
  </header>

  <pre/>
  <p>{ caption }</p>

  <script>
    async mounted() {
      const res = await fetch('/@shared/lib/console/commands.txt')
      const $pre = this.root.querySelector('pre')

      let playing = false
      let $line

      const model = this.model = createConsole(await res.text(), e => {
        const { line } = e

        if (e.scene_started) {
          $pre.innerHTML = ''
          return playing = true
        }

        if (e.line_started) {
          // previous line
          if ($line) $line.classList.remove('is-typing')

          // new line
          $line = document.createElement('div')
          $line.className = e.is_command ? 'command is-typing' : 'response'
        }


        if (line != null) {
          if (!$line.parentNode) $pre.appendChild($line)
          $line.innerHTML = line || ''
          if (line == '#') $line.classList.add('is-comment')
        }

        if (e.scene_ended) playing = false
      })

      model.start()

      addEventListener('keydown', function(e) {
        if (e.key == 'Enter' && !playing) model.next()
      })

    }
  </script>
</console>
